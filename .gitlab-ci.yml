# ======================================
# JOB OPTIONNEL: ANALYSE DE CODE
# ======================================

code:quality:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - cd backend/"JO 2024 PARIS"
    - dotnet restore
  script:
    - echo "Analyse de qualité du code..."
    - dotnet format --verify-no-changes --verbosity diagnostic
  allow_failure: true
  only:
    - dev
    - merge_requests

# ======================================
# JOB OPTIONNEL: SÉCURITÉ
# ======================================

security:scan:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - cd backend/"JO 2024 PARIS"
  script:
    - echo "Scan de sécurité des dépendances..."
    - dotnet list package --vulnerable --include-transitive
  allow_failure: true
  only:
    - dev
    - merge_requests

# ======================================
# JOB OPTIONNEL: VÉRIFICATION BASE DE DONNÉES RENDER
# ======================================

check:database:
  stage: test
  image: postgres:15
  script:
    - echo "Vérification de la connexion à la base de données Render..."
    - |
      if [ -n "$DATABASE_URL" ]; then
        psql "$DATABASE_URL" -c "SELECT version();"
        echo "Connexion à la base de données réussie"
      else
        echo "DATABASE_URL non définie"
        exit 0
      fi
  only:
    - main
  allow_failure: true