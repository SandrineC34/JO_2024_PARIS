# nginx.conf
# Configuration Nginx pour servir le frontend et proxy vers l'API

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Optimisations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    server {
        listen 80;
        server_name localhost;
        
        # Dossier racine du frontend
        root /usr/share/nginx/html;
        index index.html;

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Servir les fichiers statiques
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Pages HTML
        
        location ~ \.html$ {
            try_files $uri =404;
        }

        # Fichiers CSS
        location ~ \.css$ {
            add_header Content-Type text/css;
            try_files $uri =404;
        }

        # Fichiers JavaScript
        location ~ \.js$ {
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # Proxy vers l'API backend
        location /api/ {
            proxy_pass http://api:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Swagger (uniquement en dev)
        location /swagger/ {
            proxy_pass http://api:80/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            proxy_pass http://api:80/health;
        }

        # Cache pour les assets statiques
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(css|js)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        # Logs d'erreur personnalisés
        error_page 404 /html/404.html;
        error_page 500 502 503 504 /html/50x.html;
    }
}