# docker-compose.yml
# À placer à la RACINE du projet (JO2024_Project/)
version: '3.8'

services:
  # ============================================
  # Base de données MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: jo2024_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jo2024_db}
      MYSQL_USER: ${MYSQL_USER:-jo2024_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JO2024Pass123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jo2024_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootPassword123!}"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ============================================
  # phpMyAdmin - Interface de gestion MySQL
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jo2024_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-jo2024_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-JO2024Pass123!}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jo2024_network

  # ============================================
  # Backend API (.NET)
  # ============================================
  api:
    build:
      context: ./JO2024_backend
      dockerfile: Dockerfile
    container_name: jo2024_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=${MYSQL_DATABASE:-jo2024_db};User=${MYSQL_USER:-jo2024_user};Password=${MYSQL_PASSWORD:-JO2024Pass123!};
      - Jwt__Key=${JWT_KEY:-VotreCleSecreteTresLongueEtSecurisee123456789ABCDEF}
      - Jwt__Issuer=JO2024.API
      - Jwt__Audience=JO2024.Client
      - Jwt__ExpirationMinutes=1440
    ports:
      - "5000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jo2024_network
    volumes:
      - ./backend/logs:/app/logs

  # ============================================
  # Frontend (Nginx servant les fichiers statiques)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: jo2024_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html
      - ./frontend/css:/usr/share/nginx/html/css
      - ./frontend/js:/usr/share/nginx/html/js
      - ./nginx.conf:/etc/nginx/nginx.conf
    #  - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - jo2024_network

volumes:
  mysql_data:
    driver: local

networks:
  jo2024_network:
    driver: bridge

## Accès
# Frontend:    http://localhost:3000
# API directe: http://localhost:5000
# Swagger:     http://localhost:5000/swagger
# phpMyAdmin:  http://localhost:8080