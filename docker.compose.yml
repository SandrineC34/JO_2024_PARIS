version: '3.8'
services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile-frontend
    ports:
      - "8080:80"

  backend:
    build: 
      context: .
      dockerfile: Dockerfile-backend
    ports:
      - "5000:80"
      
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: jo_2024
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  adminer:
    image: adminer
    ports:
      - "8081:8080"
