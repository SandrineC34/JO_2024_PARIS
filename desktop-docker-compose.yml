version: '3.8'

services:
  # ============================================
  # Base de données MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: jo2024_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jo2024_db}
      MYSQL_USER: ${MYSQL_USER:-jo2024_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JO2024Pass123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - jo2024_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # ============================================
  # phpMyAdmin
  # ============================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jo2024_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jo2024_network

  # ============================================
  # MailHog (serveur SMTP factice pour dev)
  # ============================================
  mailhog:
    image: mailhog/mailhog
    container_name: jo2024_mailhog
    restart: always
    ports:
      - "8025:8025" # interface web MailHog
      - "1025:1025" # port SMTP capturé
    networks:
      - jo2024_network

  # ============================================
  # Backend API (.NET)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jo2024_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=${MYSQL_DATABASE:-jo2024_db};User=${MYSQL_USER:-jo2024_user};Password=${MYSQL_PASSWORD:-JO2024Pass123!};
      - Jwt__Key=${JWT_KEY:-DefaultJwtKeyForDevChangeMe}
      - Jwt__Issuer=${JWT_ISSUER:-JO2024.API}
      - Jwt__Audience=${JWT_AUDIENCE:-JO2024.Client}
      - Newsletter__ApiToken=${NEWSLETTER_API_TOKEN:-}
      - Email__SmtpHost=${SMTP_HOST:-mailhog}
      - Email__SmtpPort=${SMTP_PORT:-1025}
      - Email__SmtpUser=${SMTP_USER:-}
      - Email__SmtpPassword=${SMTP_PASSWORD:-}
      - Email__FromEmail=${FROM_EMAIL:-noreply@jo2024.local}
      - Email__FromName=${FROM_NAME:-JO 2024 Dev}
    ports:
      - "5000:80"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - jo2024_network
    volumes:
      - ./JO2024_Backend/logs:/app/logs

  # ============================================
  # Frontend (Nginx)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: jo2024_frontend
    restart: always
    ports:
      - "3000:80"
    # Monter tout le dossier frontend pour que les modifications locales soient visibles immédiatement
    volumes:
      - ./frontend/html:/usr/share/nginx/html
      - ./frontend/css:/usr/share/nginx/css
      - ./frontend/js:/usr/share/nginx/js
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - jo2024_network

  # ============================================
  # SCHEDULER NEWSLETTER (Alpine + Cron + rapport)
  # ============================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: jo2024_scheduler
    restart: always
    environment:
      - API_URL=http://api:80
      - NEWSLETTER_API_TOKEN=${NEWSLETTER_API_TOKEN:-}
      - TZ=Europe/Paris
    depends_on:
      - api
    networks:
      - jo2024_network
    volumes:
      - ./scheduler_logs:/var/log/scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local

networks:
  jo2024_network:
    driver: bridge

# Accès aux services:
# Frontend:    http://localhost:3000
# API:         http://localhost:5000
# Swagger:     http://localhost:5000/swagger
# phpMyAdmin:  http://localhost:8080
# Logs Cron:   ./scheduler_logs/cron.log
